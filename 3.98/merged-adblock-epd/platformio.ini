[platformio]
default_envs = s2mini

[env]
; 固定已通过编译的平台版本，避免首次构建自动切到未验收的 Arduino-ESP32 3.x。
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_BPP=2
    -DEPD_PANEL_75_JDY79668
    -DALLOW_INSECURE_FALLBACK=0
    -DCORE_DEBUG_LEVEL=1

[env:s2mini]
; ESP32-S2FNR2：4 MB flash + 2 MB PSRAM。
; 768x552 四色画布约 106 KB；按 64 行分带绘制，避免占满与 WiFi 共享的 DRAM。
board = esp32-s2-saola-1
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.psram = enabled
board_build.partitions = partitions.csv
; BOARD_HAS_PSRAM 启用 PSRAM；缺少它会让 psramInit() 退化为返回 false 的桩函数。
build_flags =
    ${env.build_flags}
    -DBOARD_PROFILE_ESP32_S2_MINI
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =

[env:c3]
; 历史 C3 板型配置，未作为本项目的部署目标验收。
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    -DBOARD_PROFILE_ESP32_C3
lib_deps =
