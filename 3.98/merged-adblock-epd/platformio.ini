[platformio]
default_envs = s2mini

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_BPP=2
    -DEPD_PANEL_75_JDY79668
    -DALLOW_INSECURE_FALLBACK=0
    -DCORE_DEBUG_LEVEL=1

[env:s2mini]
; ESP32-S2 mini: the board in hand reports ESP32-S2FNR2, i.e. 4 MB
; flash plus 2 MB embedded PSRAM. The 768x552 four-colour canvas would
; be 106 KB; it is still rendered in 64-row bands so that the picture
; never has to be materialised in DRAM (only 176 KB, shared with WiFi).
board = esp32-s2-saola-1
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.psram = enabled
board_build.partitions = partitions.csv
; BOARD_HAS_PSRAM is what actually turns PSRAM on, and it is easy to get
; wrong: cores/esp32/esp32-hal-psram.h:24-31 #undefs CONFIG_SPIRAM when that
; macro is missing, so psramInit() silently compiles down to the stub that
; returns false and every PSRAM allocation fails without any warning.
build_flags =
    ${env.build_flags}
    -DBOARD_PROFILE_ESP32_S2_MINI
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =

[env:c3]
; Same firmware, C3 wiring. No four-colour panel on this target.
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    -DBOARD_PROFILE_ESP32_C3
lib_deps =
